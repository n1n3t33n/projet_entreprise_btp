components:
  schemas:
    Affectation:
      type: object
      properties:
        role_code_role:
          type: string
        libelle_role:
          type: string
        perimetre_id_perimetre:
          type: string
          format: uuid
        libelle_perimetre:
          type: string
        chantier_id_chantier:
          type: string
          format: uuid
          nullable: true
        magasin_id_magasin:
          type: string
          format: uuid
          nullable: true
        date_debut:
          type: string
          format: date
        date_fin:
          type: string
          format: date
          nullable: true
      required:
      - chantier_id_chantier
      - date_debut
      - date_fin
      - libelle_perimetre
      - libelle_role
      - magasin_id_magasin
      - perimetre_id_perimetre
      - role_code_role
    AffectationEntreeRequest:
      type: object
      description: Affecter un lot d'étapes à un technicien, avec date prévue (EF-AVA-02).
      properties:
        etapes:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
        technicien_id_utilisateur:
          type: string
          format: uuid
        date_prevue:
          type: string
          format: date
          nullable: true
      required:
      - etapes
      - technicien_id_utilisateur
    Alerte:
      type: object
      properties:
        id_alerte:
          type: string
          format: uuid
          readOnly: true
        type_alerte:
          type: string
          maxLength: 32
        niveau:
          type: string
          maxLength: 32
        message:
          type: string
        date_emission:
          type: string
          format: date-time
        statut:
          type: string
          maxLength: 32
        article_id_article:
          type: string
          format: uuid
        magasin_id_magasin:
          type: string
          format: uuid
        designation:
          type: string
      required:
      - article_id_article
      - designation
      - id_alerte
      - magasin_id_magasin
      - message
      - niveau
      - statut
      - type_alerte
    AlerteEtape:
      type: object
      description: '``AlerteEtapeDto`` : étape en retard ou bloquée (RG-A8).'
      properties:
        id_etape:
          type: string
          format: uuid
        id_logement:
          type: string
          format: uuid
        numero_logement:
          type: string
        libelle_zone:
          type: string
        libelle_etape:
          type: string
        libelle_corps_etat:
          type: string
        couleur_corps_etat:
          type: string
        statut:
          type: string
        date_prevue:
          type: string
          format: date
          nullable: true
        jours_de_retard:
          type: integer
          readOnly: true
        code_motif_blocage:
          type: string
          nullable: true
        libelle_motif_blocage:
          type: string
          nullable: true
        commentaire:
          type: string
          nullable: true
      required:
      - couleur_corps_etat
      - date_prevue
      - id_etape
      - id_logement
      - jours_de_retard
      - libelle_corps_etat
      - libelle_etape
      - libelle_zone
      - numero_logement
      - statut
    AnnulationEntreeRequest:
      type: object
      description: 'Contre-mouvement (RG-S8, EF-STK-11) : la justification est obligatoire.'
      properties:
        motif:
          type: string
          minLength: 1
      required:
      - motif
    Appareil:
      type: object
      description: '``AppareilDto`` (web, Administration › Appareils).'
      properties:
        id_appareil:
          type: string
          format: uuid
        empreinte_materiel:
          type: string
        plateforme:
          type: string
        version_application:
          type: string
        derniere_synchronisation:
          type: string
          format: date-time
          nullable: true
        statut:
          type: string
        utilisateur_id_utilisateur:
          type: string
          format: uuid
        identifiant_utilisateur:
          type: string
        nom_utilisateur:
          type: string
      required:
      - derniere_synchronisation
      - empreinte_materiel
      - id_appareil
      - identifiant_utilisateur
      - nom_utilisateur
      - plateforme
      - statut
      - utilisateur_id_utilisateur
      - version_application
    AppareilConnexionRequest:
      type: object
      description: Bloc facultatif envoyé par le mobile (SQ-5 étape 3).
      properties:
        empreinte_materiel:
          type: string
          minLength: 1
          maxLength: 120
        plateforme:
          type: string
          minLength: 1
          maxLength: 120
        version_application:
          type: string
          minLength: 1
          maxLength: 120
      required:
      - empreinte_materiel
      - plateforme
      - version_application
    Arborescence:
      type: object
      description: '``ChantierArbreDto`` : le chantier, ses zones et leurs logements.'
      properties:
        chantier:
          $ref: '#/components/schemas/Chantier'
        zones:
          type: array
          items:
            $ref: '#/components/schemas/ZoneArborescence'
      required:
      - chantier
      - zones
    Article:
      type: object
      description: '``ArticleDto`` de l''écran Référentiels (EF-REF-03).'
      properties:
        id_article:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          maxLength: 32
        designation:
          type: string
          maxLength: 120
        origine:
          $ref: '#/components/schemas/OrigineEnum'
        code_barre:
          type: string
          nullable: true
          maxLength: 32
        actif:
          type: boolean
        categorie_article_code_categorie:
          type: string
          nullable: true
        unite_mesure_code_unite:
          type: string
      required:
      - code
      - designation
      - id_article
      - origine
      - unite_mesure_code_unite
    ArticleRequest:
      type: object
      description: '``ArticleDto`` de l''écran Référentiels (EF-REF-03).'
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 32
        designation:
          type: string
          minLength: 1
          maxLength: 120
        origine:
          $ref: '#/components/schemas/OrigineEnum'
        code_barre:
          type: string
          nullable: true
          maxLength: 32
        actif:
          type: boolean
        categorie_article_code_categorie:
          type: string
          minLength: 1
          nullable: true
        unite_mesure_code_unite:
          type: string
          minLength: 1
      required:
      - code
      - designation
      - origine
      - unite_mesure_code_unite
    ArticleStock:
      type: object
      description: '``ArticleDto`` de l''écran Stock : unité de base imbriquée (I-30).'
      properties:
        id_article:
          type: string
          format: uuid
        code:
          type: string
        designation:
          type: string
        origine:
          type: string
        code_barre:
          type: string
          nullable: true
        actif:
          type: boolean
        unite_base:
          $ref: '#/components/schemas/UniteBase'
        code_categorie:
          type: string
          nullable: true
      required:
      - actif
      - code
      - code_barre
      - code_categorie
      - designation
      - id_article
      - origine
      - unite_base
    AvancementAgrege:
      type: object
      description: '``AvancementAgregeDto`` du pilotage.'
      properties:
        portee:
          type: string
        id_cible:
          type: string
        libelle_cible:
          type: string
        libelle_secondaire:
          type: string
          nullable: true
        couleur:
          type: string
          nullable: true
        pourcentage_declare:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
        pourcentage_valide:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
        nombre_etapes:
          type: integer
        nombre_validees:
          type: integer
        nombre_bloquees:
          type: integer
        nombre_en_retard:
          type: integer
        date_calcul:
          type: string
          format: date-time
      required:
      - couleur
      - date_calcul
      - id_cible
      - libelle_cible
      - libelle_secondaire
      - nombre_bloquees
      - nombre_en_retard
      - nombre_etapes
      - nombre_validees
      - portee
      - pourcentage_declare
      - pourcentage_valide
    BlocageEntreeRequest:
      type: object
      description: |-
        Corps du web (``code_motif``, ``commentaire``) ; ``article_id_article``
        pour un manque de matériel (RG-A10).
      properties:
        code_motif:
          type: string
          minLength: 1
          maxLength: 32
        commentaire:
          type: string
          nullable: true
          maxLength: 120
        article_id_article:
          type: string
          format: uuid
          nullable: true
        uuid:
          type: string
          format: uuid
        horodatage_appareil:
          type: string
          format: date-time
      required:
      - code_motif
    Categorie:
      type: object
      description: |-
        ``CategorieDto``. ``code_parent`` toujours null : familles plates comme
        au MPD (arbitrage Q-E) ; ajout compatible pour l'écran Stock (F-11).
      properties:
        code_categorie:
          type: string
          maxLength: 32
        libelle:
          type: string
          maxLength: 120
        code_parent:
          type: string
          nullable: true
          readOnly: true
      required:
      - code_categorie
      - code_parent
      - libelle
    Chantier:
      type: object
      description: '``ChantierDto`` (web, Référentiels).'
      properties:
        id_chantier:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          maxLength: 32
        nom:
          type: string
          maxLength: 120
        programme:
          type: string
          maxLength: 120
        date_debut:
          type: string
          format: date
          nullable: true
        statut:
          $ref: '#/components/schemas/StatutActiviteEnum'
      required:
      - code
      - id_chantier
      - nom
      - statut
    ChantierRequest:
      type: object
      description: '``ChantierDto`` (web, Référentiels).'
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 32
        nom:
          type: string
          minLength: 1
          maxLength: 120
        programme:
          type: string
          maxLength: 120
        date_debut:
          type: string
          format: date
          nullable: true
        statut:
          $ref: '#/components/schemas/StatutActiviteEnum'
      required:
      - code
      - nom
      - statut
    CibleEnum:
      enum:
      - articles
      - chantiers
      - magasins
      - stock
      type: string
      description: |-
        * `articles` - articles
        * `chantiers` - chantiers
        * `magasins` - magasins
        * `stock` - stock
    ClotureEntreeRequest:
      type: object
      description: |-
        Clôture d'une fiche (EF-AVA-08) : motif de report par étape non faite ;
        sans motif, « non faite en fin de cycle ».
      properties:
        reports:
          type: array
          items:
            $ref: '#/components/schemas/ReportRequest'
    ComptageRequest:
      type: object
      properties:
        quantite_comptee:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
      required:
      - quantite_comptee
    CompteEntreeRequest:
      type: object
      description: |-
        Corps de POST/PUT /auth/comptes. ``mot_de_passe`` est un ajout
        (arbitrage Q12) : obligatoire à la création, facultatif ensuite.
      properties:
        identifiant:
          type: string
          minLength: 1
          maxLength: 120
        nom:
          type: string
          minLength: 1
          maxLength: 120
        prenom:
          type: string
          minLength: 1
          maxLength: 120
        fonction:
          type: string
          default: ''
          maxLength: 120
        statut:
          $ref: '#/components/schemas/StatutActiviteEnum'
        role_code_role:
          type: string
          minLength: 1
          maxLength: 32
        perimetre_id_perimetre:
          type: string
          format: uuid
        mot_de_passe:
          type: string
          writeOnly: true
          nullable: true
          minLength: 1
          maxLength: 256
      required:
      - identifiant
      - nom
      - perimetre_id_perimetre
      - prenom
      - role_code_role
      - statut
    ConnexionEntreeRequest:
      type: object
      properties:
        identifiant:
          type: string
          minLength: 1
          maxLength: 120
        mot_de_passe:
          type: string
          minLength: 1
          maxLength: 256
        appareil:
          $ref: '#/components/schemas/AppareilConnexionRequest'
      required:
      - identifiant
      - mot_de_passe
    CorpsEtat:
      type: object
      description: '``CorpsEtatDto`` (EF-REF-05).'
      properties:
        code_corps_etat:
          type: string
          maxLength: 32
        libelle:
          type: string
          maxLength: 120
        ordre:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        couleur:
          type: string
          maxLength: 120
      required:
      - code_corps_etat
      - couleur
      - libelle
      - ordre
    CorpsEtatRequest:
      type: object
      description: '``CorpsEtatDto`` (EF-REF-05).'
      properties:
        code_corps_etat:
          type: string
          minLength: 1
          maxLength: 32
        libelle:
          type: string
          minLength: 1
          maxLength: 120
        ordre:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        couleur:
          type: string
          minLength: 1
          maxLength: 120
      required:
      - code_corps_etat
      - couleur
      - libelle
      - ordre
    DecisionEntreeRequest:
      type: object
      description: |-
        Décision sur un mouvement à valider (EF-STK-09). Motif obligatoire
        pour un refus (ET-2 « rejeté (motif) »).
      properties:
        decision:
          $ref: '#/components/schemas/DecisionEnum'
        motif:
          type: string
          nullable: true
        uuid:
          type: string
          format: uuid
      required:
      - decision
    DecisionEnum:
      enum:
      - ACCEPTE
      - REFUSE
      type: string
      description: |-
        * `ACCEPTE` - ACCEPTE
        * `REFUSE` - REFUSE
    DecisionEtapeEntreeRequest:
      type: object
      description: |-
        ACCEPTE ou REFUSE (motif obligatoire au rejet). Le web envoie encore
        « valider » / « rejeter » (I-30) : il s'alignera (F-13).
      properties:
        decision:
          $ref: '#/components/schemas/DecisionEnum'
        motif:
          type: string
          nullable: true
          maxLength: 120
        uuid:
          type: string
          format: uuid
