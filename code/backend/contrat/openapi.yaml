openapi: 3.0.3
info:
  title: API ChantierSync
  version: B1
  description: Contrat de l'API REST de ChantierSync, généré depuis le code. Il fait
    foi pour le CONTRAT d'API ; le schéma de données, lui, est défini par le modèle
    physique (MPD) de la modélisation.
paths:
  /api/appareils:
    get:
      operationId: appareils_list
      description: GET /api/appareils.
      tags:
      - appareils
      security:
      - jetonPorteur: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Appareil'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: ''
  /api/appareils/{id_appareil}/revocation:
    post:
      operationId: appareils_revocation_create
      description: POST /api/appareils/{id}/revocation — blocage immédiat et audit.
      parameters:
      - in: path
        name: id_appareil
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - appareils
      security:
      - jetonPorteur: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appareil'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: ''
  /api/audit:
    get:
      operationId: audit_list
      description: GET /api/audit?action=&auteur=&limite= — plus récentes d'abord.
      parameters:
      - in: query
        name: action
        schema:
          type: string
        description: Action, en UPPER_SNAKE.
      - in: query
        name: auteur
        schema:
          type: string
        description: Identifiant de l'auteur (uuid).
      - in: query
        name: limite
        schema:
          type: integer
        description: Nombre maximal d'entrées (1 à 1000).
      tags:
      - audit
      security:
      - jetonPorteur: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntreeAudit'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: ''
  /api/auth/comptes:
    get:
      operationId: auth_comptes_list
      description: GET /api/auth/comptes (lister) et POST /api/auth/comptes (créer).
      tags:
      - auth
      security:
      - jetonPorteur: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Utilisateur'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: ''
    post:
      operationId: auth_comptes_create
      description: GET /api/auth/comptes (lister) et POST /api/auth/comptes (créer).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompteEntreeRequest'
        required: true
      security:
      - jetonPorteur: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Utilisateur'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: ''
  /api/auth/comptes/{id_utilisateur}:
    put:
      operationId: auth_comptes_update
      description: PUT /api/auth/comptes/{id} — modifier ou désactiver un compte.
      parameters:
      - in: path
        name: id_utilisateur
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompteEntreeRequest'
        required: true
      security:
      - jetonPorteur: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Utilisateur'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: ''
  /api/auth/connexion:
    post:
      operationId: auth_connexion_create
      description: |-
        POST /api/auth/connexion — connexion en ligne (SQ-5 étapes 2 à 5).

        Publique par nature. Limitée par IP et par identifiant (exigence 6.3) ;
        l'excès répond « 429 VERROUILLE » avec le délai restant, forme que le web
        affiche déjà (EF-AUT-04, arbitrage Q11).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnexionEntreeRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: ''
  /api/auth/deconnexion:
    post:
      operationId: auth_deconnexion_create
      description: |-
        POST /api/auth/deconnexion — trace la déconnexion (RG-D9).

        Limite documentée (arbitrage Q2) : le jeton web reste valable jusqu'à
        ses 8 h ; c'est le client qui l'oublie.
      tags:
      - auth
      security:
      - jetonPorteur: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: ''
  /api/auth/moi:
    get:
      operationId: auth_moi_retrieve
      description: |-
        GET /api/auth/moi — profil, affectations et droits effectifs.

        Sert au mobile pour remplacer sa table de navigation codée en dur
        (``ongletsPour``, I-06) par la donnée de la matrice, comme le web.
      tags:
      - auth
      security:
      - jetonPorteur: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profil'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: ''
  /api/auth/perimetres:
    get:
      operationId: auth_perimetres_list
      description: GET /api/auth/perimetres.
      tags:
      - auth
      security:
      - jetonPorteur: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Perimetre'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: ''
  /api/avancement/etapes-a-valider:
    get:
      operationId: avancement_etapes_a_valider_list
      description: |-
        GET /api/avancement/etapes-a-valider — étapes à contrôle déclarées,
        en attente du chef de chantier ou du responsable technique (RG-A4).
      tags:
      - avancement
      security:
      - jetonPorteur: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LigneEtape'
          description: ''
  /api/avancement/logements:
    get:
      operationId: avancement_logements_list
      description: GET /api/avancement/logements — un logement par ligne (H11).
      tags:
      - avancement
      security:
      - jetonPorteur: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LigneLogement'
          description: ''
  /api/avancement/synthese:
    get:
      operationId: avancement_synthese_retrieve
      description: |-
        GET /api/avancement/synthese — avancement déclaré et validé (RG-A6) et
        nombres à surveiller, sur les chantiers couverts.
      tags:
      - avancement
      security:
      - jetonPorteur: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Synthese'
          description: ''
  /api/avancement/zones:
    get:
      operationId: avancement_zones_list
      description: GET /api/avancement/zones.
      tags:
      - avancement
      security:
      - jetonPorteur: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ZoneAvancement'
          description: ''
  /api/chantiers/{id_chantier}/logements:
    get:
      operationId: chantiers_logements_list
      description: GET /api/chantiers/{id}/logements — destinations d'une sortie de
        stock.
      parameters:
      - in: path
        name: id_chantier
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - chantiers
      security:
      - jetonPorteur: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LogementDestination'
          description: ''
  /api/droits/accordes:
    get:
      operationId: droits_accordes_list
      description: GET /api/droits/accordes (lire) et PUT (remplacer) la matrice.
      tags:
      - droits
      security:
      - jetonPorteur: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DroitAccorde'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: ''
    put:
      operationId: droits_accordes_update
      description: GET /api/droits/accordes (lire) et PUT (remplacer) la matrice.
      tags:
      - droits
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatriceEntreeRequest'
        required: true
      security:
      - jetonPorteur: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DroitAccorde'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: ''
  /api/droits/permissions:
    get:
      operationId: droits_permissions_list
      description: GET /api/droits/permissions.
      tags:
      - droits
      security:
      - jetonPorteur: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Permission'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: ''
  /api/droits/roles:
    get:
      operationId: droits_roles_list
      description: GET /api/droits/roles.
      tags:
      - droits
      security:
      - jetonPorteur: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: ''
  /api/etapes/{id_etape}/blocage:
    post:
      operationId: etapes_blocage_create
      description: POST /api/etapes/{id}/blocage — blocage motivé (EF-AVA-05, RG-A10).
      parameters:
      - in: path
        name: id_etape
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - etapes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlocageEntreeRequest'
        required: true
      security:
      - jetonPorteur: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evenement'
          description: ''
  /api/etapes/{id_etape}/declaration:
    post:
      operationId: etapes_declaration_create
      description: |-
        POST /api/etapes/{id}/declaration — étape terminée (EF-AVA-04), en
        délégation si l'auteur n'est pas le technicien affecté (EF-AVA-07). Rend
        un ou deux événements (validation implicite sans contrôle, Q-X).
      parameters:
      - in: path
        name: id_etape
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - etapes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeclarationEntreeRequest'
      security:
      - jetonPorteur: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Evenement'
          description: ''
  /api/etapes/{id_etape}/evenements:
    get:
      operationId: etapes_evenements_list
      description: GET /api/etapes/{id}/evenements — historique complet (EF-AVA-10).
      parameters:
      - in: path
        name: id_etape
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - etapes
      security:
      - jetonPorteur: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Evenement'
          description: ''
  /api/etapes/{id_etape}/levee-blocage:
    post:
      operationId: etapes_levee_blocage_create
      description: POST /api/etapes/{id}/levee-blocage — reprise après blocage (ET-1).
      parameters:
      - in: path
        name: id_etape
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - etapes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeveeEntreeRequest'
      security:
      - jetonPorteur: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evenement'
          description: ''
  /api/etapes/{id_etape}/validation:
    post:
      operationId: etapes_validation_create
      description: |-
        POST /api/etapes/{id}/validation — contrôle d'une étape (EF-AVA-06) ;
        le déclarant ne contrôle pas sa propre étape (RG-D11).
      parameters:
      - in: path
        name: id_etape
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - etapes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionEtapeEntreeRequest'
        required: true
      security:
      - jetonPorteur: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evenement'
          description: ''
  /api/fiches-route:
    get:
      operationId: fiches_route_list
      description: |-
        GET /api/fiches-route?technicien=&statut= — un technicien ne voit que
        ses fiches ; l'encadrement voit celles de tous.
      parameters:
      - in: query
        name: statut
        schema:
          type: string
      - in: query
        name: technicien
        schema:
          type: string
      tags:
      - fiches-route
      security:
      - jetonPorteur: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FicheRoute'
          description: ''
  /api/fiches-route/{id_fiche}:
    get:
      operationId: fiches_route_retrieve
      description: GET /api/fiches-route/{id}.
      parameters:
      - in: path
        name: id_fiche
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - fiches-route
      security:
      - jetonPorteur: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FicheRoute'
          description: ''
  /api/fiches-route/{id_fiche}/cloture:
    post:
      operationId: fiches_route_cloture_create
      description: |-
        POST /api/fiches-route/{id}/cloture — fin de cycle, report motivé des
        étapes non faites (EF-AVA-08). Le technicien clôture sa propre fiche.
      parameters:
      - in: path
        name: id_fiche
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - fiches-route
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClotureEntreeRequest'
      security:
      - jetonPorteur: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FicheRoute'
          description: ''
  /api/fiches-route/affectations:
    post:
      operationId: fiches_route_affectations_create
      description: |-
        POST /api/fiches-route/affectations — affecter un lot d'étapes à un
        technicien, avec date prévue ; la réaffectation est tracée (RG-A3).
      tags:
      - fiches-route
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AffectationEntreeRequest'
        required: true
      security:
      - jetonPorteur: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LigneEtape'
          description: ''
  /api/fiches-route/courante:
    get:
      operationId: fiches_route_courante_list
      description: |-
        GET /api/fiches-route/courante — fiches ouvertes de l'utilisateur
        (écran « Mes fiches » du mobile, EF-AVA-03).
      tags:
      - fiches-route
      security:
      - jetonPorteur: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FicheRoute'
          description: ''
  /api/gammes:
    get:
      operationId: gammes_list
      description: GET /api/gammes.
      tags:
      - gammes
      security:
      - jetonPorteur: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Gamme'
          description: ''
  /api/gammes/{id_gamme}:
    get:
      operationId: gammes_retrieve
      description: GET /api/gammes/{id}.
      parameters:
      - in: path
        name: id_gamme
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - gammes
      security:
      - jetonPorteur: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gamme'
          description: ''
  /api/gammes/{id_gamme}/archivage:
    post:
      operationId: gammes_archivage_create
      description: POST /api/gammes/{id}/archivage.
      parameters:
      - in: path
        name: id_gamme
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - gammes
      security:
      - jetonPorteur: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gamme'
          description: ''
  /api/gammes/{id_gamme}/etapes:
    get:
      operationId: gammes_etapes_list
